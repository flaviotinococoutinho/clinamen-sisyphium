name: verificatio

on:
  push:
    branches: [main]
    tags: ["v*", "cp/*"]
  pull_request:

permissions:
  contents: read

jobs:
  verificatio:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: forma
        run: cargo fmt --all --check
      - name: lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: probationes
        run: cargo test --workspace
      - name: documenta
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: verba vetita
        run: scripts/verba.sh
      - name: modelo independente e normalização
        run: |
          python3 scripts/calibrate-costs.py --self-test
          python3 scripts/consilium-reference.py --baseline
          python3 scripts/consilium-reference.py --check crates/sisyphium/tests/fixtures/consilium.tsv
      - name: ambiente C nativo em Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $finder = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $finder -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'C tools not found in the runner image' }
          $batch = Join-Path $env:RUNNER_TEMP 'sisyphium-c-env.cmd'
          @"
          @call "$installation\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          @if errorlevel 1 exit /b 1
          @set INCLUDE
          @set LIB
          @set LIBPATH
          @set PATH
          "@ | Set-Content -LiteralPath $batch -Encoding ascii
          $values = & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'C environment setup failed' }
          foreach ($line in $values) {
            if ($line -match '^(INCLUDE|LIB|LIBPATH|PATH)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: imagens independentes
        run: |
          cargo build -p sisyphium-tabula -p sisyphium-textus
          python3 scripts/verify-images.py --binary target/debug/sisyphium-tabula
      - name: consumidores C nativos
        run: python3 scripts/verify-ffi.py
      - name: terminal e encerramento nativos
        run: python3 scripts/verify-textus.py
      - name: adaptadores com comandos substitutos
        run: python3 scripts/verify-hosts.py --platform current

  minima:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: probationes
        run: cargo +1.85.0 test --workspace
